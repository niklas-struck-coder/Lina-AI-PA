<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lina</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lina">
<meta name="theme-color" content="#0A2342">
<style>
  :root {
    --navy: #0A2342;
    --navy-light: #12315c;
    --teal: #00C2A8;
    --gold: #F4B400;
    --text: #EAF2F8;
    --muted: #7f96ad;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--navy);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  header img {
    width: 42px; height: 42px; border-radius: 12px;
  }
  header .title { font-weight: 700; font-size: 18px; }
  header .status { font-size: 12px; color: var(--teal); }
  header .status.offline { color: #ff8a80; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .msg.lina {
    align-self: flex-start;
    background: var(--navy-light);
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--teal);
    color: #04211c;
    border-bottom-right-radius: 4px;
  }
  .msg.thinking { color: var(--muted); font-style: italic; }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: var(--navy-light);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 15px;
    outline: none;
  }
  button#send, button#mute {
    background: var(--teal);
    color: #04211c;
    border: none;
    border-radius: 999px;
    width: 46px; height: 46px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  button#mute {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
  }
  button#mute.muted { color: var(--muted); }

  #setup {
    padding: 20px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }
  #setup code {
    background: var(--navy-light);
    padding: 2px 6px;
    border-radius: 6px;
    color: var(--gold);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="icon-192.png" alt="Lina">
    <div>
      <div class="title">Lina</div>
      <div class="status" id="status">bereit</div>
    </div>
    <div style="flex:1"></div>
    <button id="mute" title="Stimme an/aus">🔊</button>
  </header>

  <div id="messages"></div>

  <div id="setup" style="display:none">
    Um mit Lina zu sprechen, trage unten in <code>WORKER_URL</code> im Quellcode
    die Adresse deines Cloudflare-Worker-Proxys ein (siehe Anleitung).
  </div>

  <form id="composer">
    <input id="input" type="text" placeholder="Schreib Lina etwas…" autocomplete="off">
    <button id="send" type="submit">➤</button>
  </form>
</div>

<script>
// ---- Konfiguration ----
// Trag hier die URL deines Cloudflare-Worker-Proxys ein, z.B.:
// const WORKER_URL = "https://lina-proxy.dein-name.workers.dev";
const WORKER_URL = "PASTE_YOUR_WORKER_URL_HERE";

const LINA_GREETING = "Hey, ich bin Lina 👋 Frag mich einfach etwas.";

const messagesEl = document.getElementById('messages');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const muteBtn = document.getElementById('mute');
const setupEl = document.getElementById('setup');

let history = JSON.parse(localStorage.getItem('lina_history') || '[]');
let muted = localStorage.getItem('lina_muted') === 'true';
updateMuteBtn();

if (WORKER_URL.includes('PASTE_YOUR_WORKER_URL_HERE')) {
  setupEl.style.display = 'block';
  statusEl.textContent = 'nicht eingerichtet';
  statusEl.classList.add('offline');
}

function renderAll() {
  messagesEl.innerHTML = '';
  if (history.length === 0) {
    addBubble('lina', LINA_GREETING, false);
  } else {
    history.forEach(m => addBubble(m.role === 'assistant' ? 'lina' : 'user', m.content, false));
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addBubble(who, text, scroll = true) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  if (scroll) messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function speak(text) {
  if (muted) return;
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'de-DE';
  utter.pitch = 1.15;
  utter.rate = 1.02;
  const voices = window.speechSynthesis.getVoices();
  const femaleNames = ['petra', 'anna', 'helena', 'female', 'samantha', 'google deutsch', 'martina', 'katja'];
  let voice = voices.find(v => v.lang.toLowerCase().startsWith('de') &&
    femaleNames.some(n => v.name.toLowerCase().includes(n)));
  if (!voice) voice = voices.find(v => v.lang.toLowerCase().startsWith('de'));
  if (voice) utter.voice = voice;
  window.speechSynthesis.speak(utter);
}

// Manche Browser laden Stimmen asynchron nach
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

function updateMuteBtn() {
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.classList.toggle('muted', muted);
}

muteBtn.addEventListener('click', () => {
  muted = !muted;
  localStorage.setItem('lina_muted', muted);
  updateMuteBtn();
  if (muted) window.speechSynthesis.cancel();
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addBubble('user', text);
  history.push({ role: 'user', content: text });
  localStorage.setItem('lina_history', JSON.stringify(history));

  const thinkingBubble = addBubble('lina thinking', 'Lina denkt nach …');
  statusEl.textContent = 'tippt…';

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    thinkingBubble.remove();
    const reply = data.reply || '(keine Antwort erhalten)';
    addBubble('lina', reply);
    history.push({ role: 'assistant', content: reply });
    localStorage.setItem('lina_history', JSON.stringify(history));
    speak(reply);
    statusEl.textContent = 'bereit';
    statusEl.classList.remove('offline');
  } catch (err) {
    thinkingBubble.remove();
    addBubble('lina', 'Hmm, ich konnte gerade nicht antworten. (' + err.message + ')');
    statusEl.textContent = 'Verbindungsfehler';
    statusEl.classList.add('offline');
  }
});

renderAll();

// PWA: Service Worker optional weggelassen (keine Offline-Pflicht für diesen Zweck)
</script>
</body>
</html>
