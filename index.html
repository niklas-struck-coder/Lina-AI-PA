<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lina</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lina">
<meta name="theme-color" content="#0A2342">
<style>
  :root {
    --navy: #0A2342;
    --navy-light: #12315c;
    --teal: #00C2A8;
    --gold: #F4B400;
    --text: #EAF2F8;
    --muted: #7f96ad;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--navy);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    position: relative;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  header img {
    width: 42px; height: 42px; border-radius: 12px;
    object-fit: cover;
  }
  header .title { font-weight: 700; font-size: 18px; }
  header .status { font-size: 12px; color: var(--teal); }
  header .status.offline { color: #ff8a80; }
  header .actions { display: flex; gap: 8px; flex-shrink: 0; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    max-width: 88%;
    animation: fadeInUp 0.25s ease;
  }
  .msg-row.lina { align-self: flex-start; }
  .msg-row.user { align-self: flex-end; }
  .msg-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    flex-shrink: 0; object-fit: cover;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg {
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .msg.lina {
    background: var(--navy-light);
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: var(--teal);
    color: #04211c;
    border-bottom-right-radius: 4px;
  }
  .msg.thinking { color: var(--muted); font-style: italic; }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: var(--navy-light);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 15px;
    outline: none;
  }
  button#send, button#mute, button#call {
    background: var(--teal);
    color: #04211c;
    border: none;
    border-radius: 999px;
    width: 46px; height: 46px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  button#mute, button#call {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
  }
  button#mute.muted { color: var(--muted); }

  #setup {
    padding: 20px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }
  #setup code {
    background: var(--navy-light);
    padding: 2px 6px;
    border-radius: 6px;
    color: var(--gold);
  }

  /* ---- Anruf-Overlay ---- */
  #callOverlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, var(--navy-light), var(--navy) 75%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 56px 24px 44px;
    z-index: 50;
    text-align: center;
  }
  #callOverlay.active { display: flex; }
  .call-avatar-wrap { position: relative; margin-top: 32px; }
  .call-avatar {
    width: 140px; height: 140px; border-radius: 50%;
    object-fit: cover; position: relative; z-index: 2;
    border: 3px solid rgba(255,255,255,0.15);
  }
  .call-avatar-ring {
    position: absolute; inset: -14px; border-radius: 50%;
    border: 2px solid var(--teal); opacity: 0;
  }
  #callOverlay.listening .call-avatar-ring {
    animation: pulse-ring 1.6s ease-out infinite; opacity: 1;
  }
  #callOverlay.speaking .call-avatar-ring {
    animation: pulse-ring 0.9s ease-out infinite; opacity: 1; border-color: var(--gold);
  }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .call-name { margin-top: 20px; font-size: 22px; font-weight: 700; }
  .call-status { margin-top: 6px; font-size: 14px; color: var(--muted); min-height: 20px; }
  .call-caption {
    margin-top: 24px; font-size: 16px; text-align: center;
    color: var(--text); min-height: 48px; max-width: 420px; line-height: 1.4;
  }
  .hangup-btn {
    width: 64px; height: 64px; border-radius: 50%;
    background: #ff5252; color: white; border: none; font-size: 26px;
    cursor: pointer; box-shadow: 0 4px 16px rgba(255,82,82,0.4);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="icon-192.png" alt="Lina">
    <div>
      <div class="title">Lina</div>
      <div class="status" id="status">bereit</div>
    </div>
    <div style="flex:1"></div>
    <div class="actions">
      <button id="call" title="Anrufen">📞</button>
      <button id="mute" title="Stimme an/aus">🔊</button>
    </div>
  </header>

  <div id="messages"></div>

  <div id="setup" style="display:none">
    Um mit Lina zu sprechen, trage unten in <code>WORKER_URL</code> im Quellcode
    die Adresse deines Cloudflare-Worker-Proxys ein (siehe Anleitung).
  </div>

  <form id="composer">
    <input id="input" type="text" placeholder="Schreib Lina etwas…" autocomplete="off">
    <button id="send" type="submit">➤</button>
  </form>

  <div id="callOverlay">
    <div class="call-avatar-wrap">
      <div class="call-avatar-ring"></div>
      <img src="icon-512.png" class="call-avatar" alt="Lina">
    </div>
    <div>
      <div class="call-name">Lina</div>
      <div class="call-status" id="callStatus">Verbindet…</div>
      <div class="call-caption" id="callCaption"></div>
    </div>
    <button id="hangup" class="hangup-btn" title="Auflegen">📵</button>
  </div>
</div>

<script>
// ---- Konfiguration ----
// Trag hier die URL deines Cloudflare-Worker-Proxys ein, z.B.:
// const WORKER_URL = "https://lina-proxy.dein-name.workers.dev";
const WORKER_URL = "PASTE_YOUR_WORKER_URL_HERE";

const LINA_GREETING = "Hey, ich bin Lina 👋 Frag mich einfach etwas, oder ruf mich an.";

const messagesEl = document.getElementById('messages');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const muteBtn = document.getElementById('mute');
const setupEl = document.getElementById('setup');

let history = JSON.parse(localStorage.getItem('lina_history') || '[]');
let muted = localStorage.getItem('lina_muted') === 'true';
updateMuteBtn();

if (WORKER_URL.includes('PASTE_YOUR_WORKER_URL_HERE')) {
  setupEl.style.display = 'block';
  statusEl.textContent = 'nicht eingerichtet';
  statusEl.classList.add('offline');
}

function renderAll() {
  messagesEl.innerHTML = '';
  if (history.length === 0) {
    addBubble('lina', LINA_GREETING, false);
  } else {
    history.forEach(m => addBubble(m.role === 'assistant' ? 'lina' : 'user', m.content, false));
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addBubble(who, text, scroll = true) {
  const classes = who.split(' ');
  const row = document.createElement('div');
  row.className = 'msg-row ' + who;

  if (classes[0] === 'lina') {
    const avatar = document.createElement('img');
    avatar.src = 'icon-192.png';
    avatar.alt = 'Lina';
    avatar.className = 'msg-avatar';
    row.appendChild(avatar);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg ' + who;
  bubble.textContent = text;
  row.appendChild(bubble);

  messagesEl.appendChild(row);
  if (scroll) messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

// speak(text, onEnd, force) - force=true spricht auch wenn stummgeschaltet (Anruf-Modus)
function speak(text, onEnd, force = false) {
  if (muted && !force) { if (onEnd) onEnd(); return; }
  if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'de-DE';
  utter.pitch = 1.15;
  utter.rate = 1.02;
  const voices = window.speechSynthesis.getVoices();
  const femaleNames = ['petra', 'anna', 'helena', 'female', 'samantha', 'google deutsch', 'martina', 'katja'];
  let voice = voices.find(v => v.lang.toLowerCase().startsWith('de') &&
    femaleNames.some(n => v.name.toLowerCase().includes(n)));
  if (!voice) voice = voices.find(v => v.lang.toLowerCase().startsWith('de'));
  if (voice) utter.voice = voice;
  if (onEnd) utter.onend = onEnd;
  window.speechSynthesis.speak(utter);
}

// Manche Browser laden Stimmen asynchron nach
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

function updateMuteBtn() {
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.classList.toggle('muted', muted);
}

muteBtn.addEventListener('click', () => {
  muted = !muted;
  localStorage.setItem('lina_muted', muted);
  updateMuteBtn();
  if (muted) window.speechSynthesis.cancel();
});

// ---- Nachricht an Lina schicken (gemeinsam für Text-Chat und Anruf) ----
async function askLina(text) {
  addBubble('user', text);
  history.push({ role: 'user', content: text });
  localStorage.setItem('lina_history', JSON.stringify(history));

  const thinkingBubble = addBubble('lina thinking', 'Lina denkt nach …');
  statusEl.textContent = 'tippt…';

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    thinkingBubble.remove();
    const reply = data.reply || '(keine Antwort erhalten)';
    addBubble('lina', reply);
    history.push({ role: 'assistant', content: reply });
    localStorage.setItem('lina_history', JSON.stringify(history));
    statusEl.textContent = 'bereit';
    statusEl.classList.remove('offline');
    return reply;
  } catch (err) {
    thinkingBubble.remove();
    addBubble('lina', 'Hmm, ich konnte gerade nicht antworten. (' + err.message + ')');
    statusEl.textContent = 'Verbindungsfehler';
    statusEl.classList.add('offline');
    throw err;
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    const reply = await askLina(text);
    speak(reply);
  } catch (err) {
    // Fehler wurde bereits als Bubble angezeigt
  }
});

renderAll();

// ---- Anruf-Modus (Mikrofon + gesprochene Antworten) ----
const callBtn = document.getElementById('call');
const callOverlay = document.getElementById('callOverlay');
const callStatusEl = document.getElementById('callStatus');
const callCaptionEl = document.getElementById('callCaption');
const hangupBtn = document.getElementById('hangup');

const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let callActive = false;

function setCallState(state) {
  callOverlay.classList.remove('listening', 'speaking', 'idle');
  callOverlay.classList.add(state);
  const labels = { listening: 'Hört zu…', speaking: 'Lina spricht…', idle: 'Verbunden' };
  callStatusEl.textContent = labels[state] || '';
}

function startCall() {
  if (!SpeechRecognitionCtor) {
    alert('Sprachanrufe werden von diesem Browser nicht unterstützt. Bitte Chrome oder Edge verwenden (auf dem iPhone: Safari unterstützt das leider nicht zuverlässig).');
    return;
  }
  if (WORKER_URL.includes('PASTE_YOUR_WORKER_URL_HERE')) {
    alert('Bitte zuerst WORKER_URL im Quellcode einrichten (siehe README).');
    return;
  }
  callActive = true;
  callOverlay.classList.add('active');
  callCaptionEl.textContent = '';
  window.speechSynthesis.cancel();
  listenOnce();
}

function endCall() {
  callActive = false;
  callOverlay.classList.remove('active', 'listening', 'speaking', 'idle');
  if (recognition) { try { recognition.stop(); } catch (e) {} }
  window.speechSynthesis.cancel();
}

function listenOnce() {
  if (!callActive) return;
  recognition = new SpeechRecognitionCtor();
  recognition.lang = 'de-DE';
  recognition.interimResults = true;
  recognition.continuous = false;
  let handled = false;

  setCallState('listening');
  callCaptionEl.textContent = '';

  recognition.onresult = (event) => {
    let interim = '', final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += transcript;
      else interim += transcript;
    }
    callCaptionEl.textContent = final || interim;
    if (final && !handled) {
      handled = true;
      recognition.stop();
      handleCallUtterance(final.trim());
    }
  };

  recognition.onerror = (event) => {
    if (!callActive) return;
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      handled = true;
      callStatusEl.textContent = 'Mikrofon-Zugriff verweigert';
      endCall();
      alert('Mikrofonzugriff wurde verweigert. Bitte in den Browser-Einstellungen für diese Seite erlauben.');
      return;
    }
    if (event.error === 'no-speech' || event.error === 'aborted') {
      handled = true;
      if (callActive) listenOnce();
      return;
    }
    handled = true;
    callStatusEl.textContent = 'Fehler: ' + event.error;
    if (callActive) setTimeout(() => { if (callActive) listenOnce(); }, 1500);
  };

  recognition.onend = () => {
    if (!handled && callActive) listenOnce();
  };

  try { recognition.start(); } catch (e) {}
}

async function handleCallUtterance(text) {
  if (!text) { if (callActive) listenOnce(); return; }
  callCaptionEl.textContent = text;
  setCallState('idle');
  callStatusEl.textContent = 'Lina denkt nach…';
  try {
    const reply = await askLina(text);
    if (!callActive) return;
    callCaptionEl.textContent = reply;
    setCallState('speaking');
    speak(reply, () => { if (callActive) listenOnce(); }, true);
  } catch (err) {
    if (callActive) listenOnce();
  }
}

callBtn.addEventListener('click', startCall);
hangupBtn.addEventListener('click', endCall);

// PWA: Service Worker optional weggelassen (keine Offline-Pflicht für diesen Zweck)
</script>
</body>
</html>
