<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lina & Team</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lina">
<meta name="theme-color" content="#FAF6EF">
<style>
  :root {
    --cream: #FAF6EF;
    --cream-panel: #F0E7D6;
    --white: #FFFFFF;
    --ink: #2B2A28;
    --muted: #948773;
    --teal: #00A98F;
    --gold: #A8600A;
    --danger: #E4573D;
    --persona: #00A98F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    background: var(--cream);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--white);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 1px 3px rgba(43,42,40,0.04);
    flex-shrink: 0;
  }
  .avatar-badge {
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0; overflow: hidden;
    background: color-mix(in srgb, var(--persona) 18%, var(--cream-panel));
  }
  .avatar-badge img { width: 100%; height: 100%; object-fit: cover; }
  header .title { font-weight: 700; font-size: 18px; }
  header .status { font-size: 12px; color: var(--teal); }
  header .status.offline { color: var(--danger); }
  header .actions { display: flex; gap: 8px; flex-shrink: 0; }

  button#menuToggle {
    background: transparent;
    border: none;
    color: var(--ink);
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
    flex-shrink: 0;
  }

  /* ---- Menü-Schublade (WhatsApp-Style) ---- */
  #menuOverlay {
    position: fixed;
    inset: 0;
    background: rgba(20,18,15,0.35);
    z-index: 60;
    display: none;
  }
  #menuOverlay.active { display: block; }
  #drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 280px;
    max-width: 82vw;
    background: var(--white);
    z-index: 70;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 20px rgba(20,18,15,0.15);
  }
  #drawer.active { transform: translateX(0); }
  .drawer-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    flex-shrink: 0;
  }
  .drawer-title { font-weight: 700; font-size: 17px; }
  .drawer-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .drawer-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
  }
  .drawer-item:hover, .drawer-item.active { background: var(--cream-panel); }
  .drawer-item .avatar-badge { width: 44px; height: 44px; font-size: 22px; }
  .drawer-item-text { flex: 1; min-width: 0; }
  .drawer-item-name { font-weight: 600; font-size: 15px; }
  .drawer-item-role { font-size: 12px; color: var(--muted); }
  .drawer-settings-btn {
    margin: 8px 16px 16px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.08);
    background: var(--cream-panel);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ---- Einstellungen ---- */
  #settingsScreen {
    position: fixed;
    inset: 0;
    background: var(--cream);
    z-index: 90;
    display: none;
    flex-direction: column;
  }
  #settingsScreen.active { display: flex; }
  .settings-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--white);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    flex-shrink: 0;
  }
  .settings-header button {
    background: transparent;
    border: none;
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  .settings-header h1 { font-size: 17px; margin: 0; }
  .settings-list {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .settings-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--white);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 14px;
    padding: 12px;
  }
  .settings-avatar {
    width: 52px; height: 52px; font-size: 26px;
    cursor: pointer; flex-shrink: 0; position: relative;
  }
  .settings-avatar::after {
    content: '\270E';
    position: absolute; bottom: -2px; right: -2px;
    background: var(--teal); color: #fff;
    width: 18px; height: 18px; border-radius: 50%;
    font-size: 10px; display: flex; align-items: center; justify-content: center;
  }
  .settings-name-input {
    flex: 1; min-width: 0;
    background: var(--cream-panel);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--ink);
    outline: none;
  }
  .settings-reset {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
    padding: 6px;
  }
  .settings-voices {
    background: var(--white);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 14px;
    padding: 14px;
    font-size: 13px;
  }
  .settings-voices-title { font-weight: 700; margin-bottom: 6px; }
  .settings-voices-list { color: var(--muted); line-height: 1.5; word-break: break-word; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    max-width: 88%;
    animation: fadeInUp 0.25s ease;
  }
  .msg-row.lina { align-self: flex-start; }
  .msg-row.user { align-self: flex-end; }
  .msg-avatar-badge {
    width: 26px; height: 26px; border-radius: 50%;
    flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    background: color-mix(in srgb, var(--badge-color, var(--teal)) 20%, var(--cream-panel));
  }
  .msg-avatar-badge img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg {
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
  }
  .msg.lina {
    background: var(--white);
    border: 1px solid rgba(0,0,0,0.05);
    border-left: 3px solid var(--badge-color, transparent);
    box-shadow: 0 1px 2px rgba(43,42,40,0.05);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: var(--teal);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }
  .msg.thinking { color: var(--muted); font-style: italic; }
  .msg-label { font-size: 11px; font-weight: 700; margin-bottom: 3px; color: var(--badge-color, var(--muted)); }
  .msg-caption { white-space: pre-wrap; }
  .msg.has-image { padding: 6px; }
  .msg.has-image .msg-caption { padding: 8px 6px 2px; }
  .msg-image {
    display: block;
    max-width: 220px;
    width: 100%;
    border-radius: 12px;
  }

  #imagePreview {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--cream-panel);
    border-top: 1px solid rgba(0,0,0,0.06);
  }
  #imagePreview img {
    width: 48px; height: 48px; border-radius: 10px; object-fit: cover;
  }
  #imagePreview span { font-size: 13px; color: var(--muted); flex: 1; }
  #removeImage {
    background: rgba(0,0,0,0.08);
    border: none;
    border-radius: 50%;
    width: 26px; height: 26px;
    cursor: pointer;
    color: var(--ink);
    font-size: 14px;
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: var(--white);
    border-top: 1px solid rgba(0,0,0,0.06);
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: var(--cream-panel);
    border: 1px solid rgba(0,0,0,0.06);
    color: var(--ink);
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 15px;
    outline: none;
  }
  button#send, button#mute, button#call, button#attach {
    border-radius: 999px;
    width: 46px; height: 46px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    border: none;
  }
  button#send {
    background: var(--teal);
    color: #ffffff;
  }
  button#mute, button#call, button#attach {
    background: transparent;
    border: 1px solid rgba(0,0,0,0.1);
    color: var(--ink);
  }
  button#mute.muted { color: var(--muted); }

  #setup {
    padding: 20px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }
  #setup code {
    background: var(--cream-panel);
    padding: 2px 6px;
    border-radius: 6px;
    color: var(--gold);
  }

  /* ---- Anruf-Overlay ---- */
  #callOverlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, var(--white), var(--cream) 75%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 56px 24px 44px;
    z-index: 50;
    text-align: center;
  }
  #callOverlay.active { display: flex; }
  .call-avatar-wrap { position: relative; margin-top: 32px; }
  .call-avatar {
    width: 140px; height: 140px; border-radius: 50%;
    object-fit: cover; position: relative; z-index: 2;
    border: 3px solid rgba(0,0,0,0.06);
    box-shadow: 0 4px 20px rgba(43,42,40,0.12);
  }
  .call-avatar.emoji {
    display: flex; align-items: center; justify-content: center;
    font-size: 64px;
    background: color-mix(in srgb, var(--persona) 18%, var(--white));
  }
  .call-avatar-ring {
    position: absolute; inset: -14px; border-radius: 50%;
    border: 2px solid var(--teal); opacity: 0;
  }
  #callOverlay.listening .call-avatar-ring {
    animation: pulse-ring 1.6s ease-out infinite; opacity: 1;
  }
  #callOverlay.speaking .call-avatar-ring {
    animation: pulse-ring 0.9s ease-out infinite; opacity: 1; border-color: var(--gold);
  }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .call-name { margin-top: 20px; font-size: 22px; font-weight: 700; }
  .call-status { margin-top: 6px; font-size: 14px; color: var(--muted); min-height: 20px; }
  .call-caption {
    margin-top: 24px; font-size: 16px; text-align: center;
    color: var(--ink); min-height: 48px; max-width: 420px; line-height: 1.4;
  }
  .hangup-btn {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--danger); color: white; border: none; font-size: 26px;
    cursor: pointer; box-shadow: 0 4px 16px rgba(228,87,61,0.35);
  }

  /* ---- Login/Zugangscode ---- */
  #loginScreen {
    position: fixed;
    inset: 0;
    background: var(--cream);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  #loginScreen.active { display: flex; }
  .login-card {
    background: var(--white);
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(43,42,40,0.1);
  }
  .login-card .avatar-badge {
    width: 64px; height: 64px; font-size: 32px;
    margin: 0 auto 16px;
  }
  .login-card h1 { font-size: 20px; margin: 0 0 8px; }
  .login-card p { font-size: 14px; color: var(--muted); margin: 0 0 20px; line-height: 1.4; }
  #loginForm { display: flex; flex-direction: column; gap: 12px; }
  #accessCodeInput {
    background: var(--cream-panel);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 16px;
    text-align: center;
    color: var(--ink);
    outline: none;
  }
  #loginForm button {
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #loginError {
    display: none;
    color: var(--danger);
    font-size: 13px;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-card">
    <div class="avatar-badge"><img src="icon-192.png" alt="Lina"></div>
    <h1>Zugangscode</h1>
    <p>Bitte gib den Zugangscode ein, um mit Lina &amp; Team zu chatten.</p>
    <form id="loginForm">
      <input id="accessCodeInput" type="password" placeholder="Zugangscode" autocomplete="off">
      <button type="submit">Weiter</button>
    </form>
    <div id="loginError"></div>
  </div>
</div>
<div id="menuOverlay"></div>
<nav id="drawer">
  <div class="drawer-header">
    <div class="avatar-badge"><img src="icon-192.png" alt="Lina"></div>
    <div class="drawer-title">Lina &amp; Team</div>
  </div>
  <div class="drawer-list" id="drawerList"></div>
  <button id="openSettings" class="drawer-settings-btn">⚙️ Einstellungen</button>
</nav>

<div id="settingsScreen">
  <div class="settings-header">
    <button id="closeSettings">← Zurück</button>
    <h1>Einstellungen</h1>
  </div>
  <div class="settings-list" id="settingsList"></div>
</div>

<div id="app">
  <header>
    <button id="menuToggle" title="Menü">☰</button>
    <div id="headerAvatar" class="avatar-badge"></div>
    <div>
      <div class="title" id="headerTitle">Lina</div>
      <div class="status" id="status">bereit</div>
    </div>
    <div style="flex:1"></div>
    <div class="actions">
      <button id="call" title="Anrufen">📞</button>
      <button id="mute" title="Stimme an/aus">🔊</button>
    </div>
  </header>

  <div id="messages"></div>

  <div id="setup" style="display:none">
    Um mit dem Team zu sprechen, trage unten in <code>WORKER_URL</code> im Quellcode
    die Adresse deines Cloudflare-Worker-Proxys ein (siehe Anleitung).
  </div>

  <div id="imagePreview">
    <img id="imagePreviewImg" alt="Vorschau">
    <span>Bild wird mitgeschickt</span>
    <button type="button" id="removeImage" title="Entfernen">✕</button>
  </div>

  <form id="composer">
    <input type="file" id="imageInput" accept="image/*" hidden>
    <button type="button" id="attach" title="Bild senden">🖼️</button>
    <input id="input" type="text" placeholder="Schreib etwas…" autocomplete="off">
    <button id="send" type="submit">➤</button>
  </form>

  <div id="callOverlay">
    <div class="call-avatar-wrap">
      <div class="call-avatar-ring"></div>
      <div class="call-avatar" id="callAvatar"></div>
    </div>
    <div>
      <div class="call-name" id="callName">Lina</div>
      <div class="call-status" id="callStatus">Verbindet…</div>
      <div class="call-caption" id="callCaption"></div>
    </div>
    <button id="hangup" class="hangup-btn" title="Auflegen">📵</button>
  </div>
</div>

<script>
// ---- Konfiguration ----
// Trag hier die URL deines Cloudflare-Worker-Proxys ein, z.B.:
// const WORKER_URL = "https://lina-proxy.dein-name.workers.dev";
const WORKER_URL = "https://wispy-term-8f4f.niklas-struck.workers.dev";
const MAX_IMAGE_BYTES = 4 * 1024 * 1024;
// Verlauf begrenzen, damit die Anfrage nicht unbegrenzt wächst (führte zu
// HTTP 413 "Payload Too Large", sobald genug Nachrichten/Bilder/eine sehr
// lange Antwort im Verlauf standen).
const MAX_STORED_MESSAGES = 40; // wie viel lokal pro Person gespeichert bleibt
const MAX_SENT_MESSAGES = 16;   // wie viel davon pro Anfrage an den Worker geht
const MAX_SENT_TEXT_CHARS = 4000; // einzelne überlange Nachrichten kappen

// ---- Team ----
// voice: bevorzugte Stimmnamen (je nachdem was Browser/Gerät anbietet) +
// Tonhöhe/Tempo als verlässlicher Unterschied, falls nur 1-2 Stimmen
// verfügbar sind (Web Speech API kann pro Gerät stark variieren).
// "stimme X" matcht die auf dem Mac heruntergeladenen Siri-Stimmen 1-4 -
// jede Person bekommt eine eigene feste Nummer zugewiesen.
const PERSONAS = {
  lina: {
    name: 'Lina', tabLabel: '💬 Lina', role: 'Persönliche Assistentin',
    avatarType: 'img', avatar: 'icon-192.png', color: '#00A98F',
    greeting: 'Hey, ich bin Lina 👋 Frag mich einfach etwas, schick mir ein Bild, oder ruf mich an.',
    voice: { names: ['stimme 3', 'petra', 'anna', 'helena', 'female', 'samantha', 'google deutsch', 'martina', 'katja'], pitch: 1.1, rate: 1.0 },
  },
  it: {
    name: 'IT-Chef', tabLabel: '🖥️ IT-Chef', role: 'Technik & Entwicklung',
    avatarType: 'emoji', avatar: '🖥️', color: '#3E6FB0',
    greeting: 'IT-Chef hier 🖥️ Frag mich zu Code, Architektur oder travix.ai-Technik.',
    voice: { names: ['stimme 4', 'markus', 'yannick', 'stefan', 'conrad', 'daniel', 'male', 'google deutsch'], pitch: 0.9, rate: 0.98 },
  },
  marketing: {
    name: 'Marketing-Chef', tabLabel: '📈 Marketing', role: 'Marketing & Strategie',
    avatarType: 'emoji', avatar: '📈', color: '#D98A2B',
    greeting: 'Marketing-Chef hier 📈 Lass uns über Positionierung, Zielgruppen oder Kampagnen sprechen.',
    voice: { names: ['stimme 2', 'yannick', 'markus', 'stefan', 'conrad', 'daniel', 'male'], pitch: 1.05, rate: 1.1 },
  },
  support: {
    name: 'Support-Chef', tabLabel: '🎧 Support', role: 'Kundenservice & Support',
    avatarType: 'emoji', avatar: '🎧', color: '#8E5FC7',
    greeting: 'Support-Chef hier 🎧 Frag mich zu Kundenerfahrung, Support-Prozessen oder Nutzerproblemen.',
    voice: { names: ['stimme 1', 'anna', 'helena', 'petra', 'female', 'martina', 'katja'], pitch: 0.95, rate: 0.96 },
  },
  team: {
    name: 'Team-Meeting', tabLabel: '👥 Team-Meeting', role: 'Alle zusammen',
    avatarType: 'emoji', avatar: '👥', color: '#4A4640',
    greeting: 'Willkommen im Team-Meeting 👥 Frag etwas — die passenden Personen antworten.',
    voice: { names: ['google deutsch'], pitch: 1.0, rate: 1.0 },
  },
};
const PERSONA_ORDER = ['lina', 'it', 'marketing', 'support', 'team'];
// NAME_TO_KEY bleibt an die festen Basis-Namen gebunden (nicht umbenannt) -
// die API/das Modell kennt nur diese Namen im "Name: Text"-Team-Format.
const NAME_TO_KEY = Object.fromEntries(
  PERSONA_ORDER.filter(k => k !== 'team').map(k => [PERSONAS[k].name, k])
);

let activeTab = localStorage.getItem('lina_active_tab') || 'lina';
if (!PERSONAS[activeTab]) activeTab = 'lina';

// ---- Persona-Anpassungen (Name/Profilbild, pro Person überschreibbar) ----
let personaOverrides = {};
try { personaOverrides = JSON.parse(localStorage.getItem('lina_persona_overrides') || '{}'); } catch (e) {}

function savePersonaOverrides() {
  localStorage.setItem('lina_persona_overrides', JSON.stringify(personaOverrides));
}

function getPersona(key) {
  const base = PERSONAS[key];
  const ov = personaOverrides[key];
  if (!ov) return base;
  return {
    ...base,
    name: ov.name && ov.name.trim() ? ov.name.trim() : base.name,
    avatarType: ov.avatarDataUrl ? 'img' : base.avatarType,
    avatar: ov.avatarDataUrl || base.avatar,
  };
}

const messagesEl = document.getElementById('messages');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const muteBtn = document.getElementById('mute');
const setupEl = document.getElementById('setup');
const attachBtn = document.getElementById('attach');
const imageInput = document.getElementById('imageInput');
const imagePreview = document.getElementById('imagePreview');
const imagePreviewImg = document.getElementById('imagePreviewImg');
const removeImageBtn = document.getElementById('removeImage');
const headerAvatarEl = document.getElementById('headerAvatar');
const headerTitleEl = document.getElementById('headerTitle');

let histories = loadHistories();
let muted = localStorage.getItem('lina_muted') === 'true';
// 'en' = Groq-Stimme (klingt natürlich, spricht Deutsch mit englischem Akzent)
// 'de' = Browser-eigene deutsche Stimme (korrekte Aussprache, klingt robotischer)
let voiceLang = localStorage.getItem('lina_voice_lang') === 'de' ? 'de' : 'en';

function contentToDisplay(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    const textBlock = content.find(b => b.type === 'text');
    const imageBlock = content.find(b => b.type === 'image');
    return {
      text: textBlock ? textBlock.text : '',
      imageDataUrl: imageBlock ? ('data:' + imageBlock.source.media_type + ';base64,' + imageBlock.source.data) : null,
    };
  }
  return '';
}

// Zerlegt eine Team-Antwort ("Lina: ...\nIT-Chef: ...") in einzelne Wortmeldungen
function parseTeamReply(text) {
  const lines = String(text || '').split('\n');
  const names = Object.keys(NAME_TO_KEY);
  const segments = [];
  let current = null;
  lines.forEach(line => {
    const match = names.find(name => line.startsWith(name + ':'));
    if (match) {
      if (current) segments.push(current);
      current = { name: match, text: line.slice(match.length + 1).trim() };
    } else if (current) {
      current.text += (line ? (current.text ? '\n' : '') + line : '');
    } else if (line.trim()) {
      current = { name: null, text: line.trim() };
    }
  });
  if (current) segments.push(current);
  return segments.filter(s => s.text && s.text.trim());
}

function renderTeamReply(text, scroll = true) {
  const segments = parseTeamReply(text);
  if (segments.length === 0) {
    addBubble('lina', text, scroll, 'team', getPersona('team').name);
    return;
  }
  segments.forEach(seg => {
    const key = seg.name ? (NAME_TO_KEY[seg.name] || 'team') : 'team';
    addBubble('lina', seg.text, scroll, key, getPersona(key).name);
  });
}

    bubble.appendChild(labelEl);
  }

  return row;

// speak(text, onEnd, force, personaKey) - force=true spricht auch wenn
// stummgeschaltet (Anruf-Modus). Holt echtes, natürlich klingendes Audio
// von ElevenLabs (über den Worker); fällt bei Fehlern/aufgebrauchtem
// Kontingent automatisch auf die Browser-Stimme zurück.
let currentAudio = null;

// iOS/Safari erlaubt audio.play() nur, wenn es direkt aus einem Fingertipp
// ausgelöst wird. Im Anruf-Modus kommt die Antwort aber über Spracherkennung
// (kein Tap), also blockiert Safari die echte Stimme und die App fällt
// still auf die Browser-Ersatzstimme zurück. Fix: beim allerersten Tap
// irgendwo auf der Seite ein winziges stummes Audio abspielen - das
// "entsperrt" programmatisches audio.play() für den Rest der Sitzung.
let audioUnlocked = false;
function unlockAudioPlayback() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try {
    const silence = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
    silence.play().catch(() => {});
  } catch (e) {}
}
document.addEventListener('click', unlockAudioPlayback, { once: true });
document.addEventListener('touchend', unlockAudioPlayback, { once: true });

// Stoppt jede laufende Sprachausgabe sofort (Groq-Audio + Browser-Fallback) -
// zentrale Stelle, damit "Auflegen" und "Unterbrechen beim Reinreden" nie
// vergessen, eine der beiden Audioquellen zu stoppen.
function stopSpeaking() {
  if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

async function speak(text, onEnd, force = false, personaKey = 'lina') {
  if (muted && !force) { if (onEnd) onEnd(); return; }
  stopSpeaking();

  if (voiceLang === 'de') { speakFallback(text, onEnd, personaKey); return; }

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Access-Code': accessCode },
      body: JSON.stringify({ action: 'speak', text, persona: personaKey }),
    });
    if (!res.ok) throw new Error('TTS HTTP ' + res.status);
    const data = await res.json();
    if (!data.audio) throw new Error('Kein Audio erhalten');

    const audio = new Audio(`data:${data.mime};base64,${data.audio}`);
    currentAudio = audio;
    audio.onended = () => { currentAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { currentAudio = null; speakFallback(text, onEnd, personaKey); };
    await audio.play();
  } catch (err) {
    speakFallback(text, onEnd, personaKey);
  }
}

// Browser-eigene Sprachausgabe als Rückfallebene (falls die Groq-Stimme mal
// nicht erreichbar ist). Nutzt bewusst für ALLE Personas dieselbe Stimme
// wie Lina (Ni möchte eine einheitliche Stimme statt pro Person eine
// eigene, auch im Rückfall-Modus).
function speakFallback(text, onEnd, personaKey) {
  if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'de-DE';
  const vc = PERSONAS.lina.voice;
  utter.pitch = vc.pitch;
  utter.rate = vc.rate;
  const voices = window.speechSynthesis.getVoices();
  let voice = voices.find(v => v.lang.toLowerCase().startsWith('de') &&
    vc.names.some(n => v.name.toLowerCase().includes(n)));
  if (!voice) voice = voices.find(v => v.lang.toLowerCase().startsWith('de'));
  if (voice) utter.voice = voice;
  if (onEnd) utter.onend = onEnd;
  window.speechSynthesis.speak(utter);
}

// Spricht eine Team-Antwort segmentweise, jede Person mit ihrer eigenen
// Stimme. uiCallback (optional) wird vor jedem Segment aufgerufen, für
// Anruf-Untertitel o.ä.
function speakSegmentsQueue(segments, idx, onAllDone, uiCallback, force = false) {
  if (idx >= segments.length) { if (onAllDone) onAllDone(); return; }
  const seg = segments[idx];
  const key = seg.name ? (NAME_TO_KEY[seg.name] || 'team') : 'team';
  if (uiCallback) uiCallback(seg, key);
  const spoken = seg.name ? `${getPersona(key).name} sagt: ${seg.text}` : seg.text;
  speak(spoken, () => speakSegmentsQueue(segments, idx + 1, onAllDone, uiCallback, force), force, key);
}

function speakTeamReply(text) {

}

// ---- Nachricht an eine Persona schicken ----
// userContent: was an die API geschickt wird (String oder Content-Block-Array)
// displayContent: was als Chat-Bubble gerendert wird (String oder {text, imageDataUrl})
// Baut aus dem (lokal unbegrenzten) Verlauf eine gekappte Kopie fürs
// Backend: nur die letzten MAX_SENT_MESSAGES Nachrichten, nur das jüngste
// Bild (ältere Bilder raus), und keine einzelne Nachricht länger als
// MAX_SENT_TEXT_CHARS. Verändert `hist` selbst nicht.
function trimHistoryForRequest(hist) {
  const recent = hist.slice(-MAX_SENT_MESSAGES);
  let imageKept = false;
  const out = [];
  for (let i = recent.length - 1; i >= 0; i--) {
    const m = recent[i];
    let content = m.content;
    if (Array.isArray(content)) {
      if (content.some(b => b.type === 'image')) {
        if (imageKept) {
          const textBlock = content.find(b => b.type === 'text');
          content = [{ type: 'text', text: ((textBlock && textBlock.text) ? textBlock.text + ' ' : '') + '[altes Bild aus Verlauf entfernt]' }];
        } else {
          imageKept = true;
        }
      }
    } else if (typeof content === 'string' && content.length > MAX_SENT_TEXT_CHARS) {
      content = content.slice(0, MAX_SENT_TEXT_CHARS) + '\n[…gekürzt]';
    }
    out.unshift({ role: m.role, content });
  }
  return out;
}

function capHistory(hist) {
  while (hist.length > MAX_STORED_MESSAGES) hist.shift();
}

// Kurzer Auszug aus den letzten privaten Gesprächen (pro Person das letzte
// Hin und Her), damit das Team-Meeting weiß, was Ni ihnen einzeln erzählt
// hat, ohne den kompletten Verlauf mitzuschicken (Tokenbudget).
function buildPrivateDigest() {
  const parts = [];
  PERSONA_ORDER.forEach(key => {
    if (key === 'team') return;
    const h = histories[key];
    if (!h || h.length === 0) return;
    const lines = h.slice(-4).map(m => {
      const disp = contentToDisplay(m.content);
      const text = (typeof disp === 'string' ? disp : disp.text) || (disp.imageDataUrl ? '[Bild]' : '');
      if (!text) return null;
      const short = text.length > 200 ? text.slice(0, 200) + '…' : text;
      return `${m.role === 'user' ? 'Ni' : PERSONAS[key].name}: ${short}`;
    }).filter(Boolean);
    if (lines.length) parts.push(`Mit ${PERSONAS[key].name}:\n${lines.join('\n')}`);
  });
  return parts.join('\n\n');
}

async function askPersona(personaKey, userContent, displayContent) {
  const hist = histories[personaKey];
  addBubble('user', displayContent !== undefined ? displayContent : userContent);
  hist.push({ role: 'user', content: userContent });
  capHistory(hist);
  saveHistories();

  const thinkingBubble = addBubble('lina thinking', getPersona(personaKey).name + ' denkt nach …', true, personaKey);
  statusEl.textContent = 'tippt…';

  try {
    const requestBody = { messages: trimHistoryForRequest(hist), persona: personaKey };
    if (personaKey === 'team') {
      const digest = buildPrivateDigest();
      if (digest) requestBody.privateDigest = digest;
    }
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Access-Code': accessCode },
      body: JSON.stringify(requestBody)
    });
    if (res.status === 401) {
      thinkingBubble.remove();
      localStorage.removeItem('lina_access_code');
      accessCode = '';
      statusEl.textContent = 'nicht eingeloggt';
      statusEl.classList.add('offline');
      showLogin('Falscher Zugangscode. Bitte erneut eingeben.');
      throw new Error('Unauthorized');
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    thinkingBubble.remove();
    const reply = data.reply || '(keine Antwort erhalten)';

    if (personaKey === 'team') {
      renderTeamReply(reply);
    } else {
      addBubble('lina', reply, true, personaKey);
    }

    hist.push({ role: 'assistant', content: reply });
    capHistory(hist);
    saveHistories();

    // Auf Wunsch ("sag das dem Team") hat die Persona etwas ins
    // Team-Meeting gepostet - dort einsortieren, egal welcher Tab gerade
    // offen ist (nächstes Öffnen von Team-Meeting zeigt es).
    if (data.shareWithTeam && personaKey !== 'team') {
      histories.team.push({ role: 'assistant', content: `${PERSONAS[personaKey].name}: ${data.shareWithTeam}` });
      capHistory(histories.team);
      saveHistories();
      if (activeTab === 'team') renderActiveTab();
    }

    statusEl.textContent = 'bereit';
    statusEl.classList.remove('offline');
    return reply;
  } catch (err) {
    thinkingBubble.remove();
    if (err.message !== 'Unauthorized') {
      addBubble('lina', 'Hmm, ich konnte gerade nicht antworten. (' + err.message + ')', true, personaKey);
      statusEl.textContent = 'Verbindungsfehler';
      statusEl.classList.add('offline');
    }
    throw err;
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text && !pendingImage) return;
  input.value = '';

  let userContent, displayContent;
  if (pendingImage) {
    userContent = [
      { type: 'image', source: { type: 'base64', media_type: pendingImage.mediaType, data: pendingImage.base64 } },
    ];
    if (text) userContent.push({ type: 'text', text });
    displayContent = { text, imageDataUrl: pendingImage.dataUrl };
    pendingImage = null;
    imagePreview.style.display = 'none';
  } else {
    userContent = text;
    displayContent = text;
  }

  try {
    const reply = await askPersona(activeTab, userContent, displayContent);
    if (activeTab === 'team') {
      speakTeamReply(reply);
    } else {
      speak(reply, undefined, false, activeTab);
    }
  } catch (err) {
    // Fehler wurde bereits als Bubble angezeigt
  }
});

applyPersonaChrome();
renderActiveTab();
updateMuteBtn();

// ---- Anruf-Modus (Mikrofon + gesprochene Antworten) ----
const callBtn = document.getElementById('call');
const callOverlay = document.getElementById('callOverlay');
const callAvatarEl = document.getElementById('callAvatar');
const callNameEl = document.getElementById('callName');
const callStatusEl = document.getElementById('callStatus');
const callCaptionEl = document.getElementById('callCaption');
const hangupBtn = document.getElementById('hangup');

const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let callActive = false;
// Hinweis: Es gab hier mal ein "Barge-in" (Mikrofon hört mit, während die KI
// spricht, um Reinreden zu erkennen). Root Cause eines Bugs, bei dem im
// Anruf keine Stimme mehr zu hören war (Text kam, Ton nicht): das Mikrofon
// hat vermutlich die eigene KI-Stimme aus dem Lautsprecher aufgeschnappt
// und sich dadurch selbst sofort wieder stummgeschaltet, bzw. zwei parallel
// laufende Spracherkennungs-Sessions haben die Audiowiedergabe gestört.
// Deshalb bewusst entfernt - Anruf ist jetzt wieder strikt abwechselnd
// (erst sie fertig sprechen lassen, dann reden), aber die Stimme ist
// verlässlich zu hören, was wichtiger ist.
function stopBargeInListener() {}

function setCallState(state) {
  callOverlay.classList.remove('listening', 'speaking', 'idle');
  callOverlay.classList.add(state);
  const labels = { listening: 'Hört zu…', speaking: 'spricht…', idle: 'Verbunden' };
  callStatusEl.textContent = labels[state] || '';
}

function setupCallChrome() {
  const p = getPersona(activeTab);
  callNameEl.textContent = p.name;
  callAvatarEl.innerHTML = '';
  callAvatarEl.classList.remove('emoji');
  if (p.avatarType === 'img') {
    const img = document.createElement('img');
    img.src = p.avatar;
    img.alt = p.name;
    img.style.width = '100%'; img.style.height = '100%';
    img.style.objectFit = 'cover'; img.style.borderRadius = '50%';
    callAvatarEl.appendChild(img);
  } else {
    callAvatarEl.classList.add('emoji');
    callAvatarEl.textContent = p.avatar;
  }
}

function startCall() {
  if (!SpeechRecognitionCtor) {
    alert('Sprachanrufe werden von diesem Browser nicht unterstützt. Bitte Chrome oder Edge verwenden (auf dem iPhone: Safari unterstützt das leider nicht zuverlässig).');
    return;
  }
  if (WORKER_URL.includes('PASTE_YOUR_WORKER_URL_HERE')) {
    alert('Bitte zuerst WORKER_URL im Quellcode einrichten (siehe README).');
    return;
  }
  callActive = true;
  setupCallChrome();
  callOverlay.classList.add('active');
  callCaptionEl.textContent = '';
  stopSpeaking();
  listenOnce();
}

function endCall() {
  callActive = false;
  callOverlay.classList.remove('active', 'listening', 'speaking', 'idle');
  if (recognition) { try { recognition.stop(); } catch (e) {} }
  stopBargeInListener();
  stopSpeaking();
}

function listenOnce() {
  if (!callActive) return;
  recognition = new SpeechRecognitionCtor();
  recognition.lang = 'de-DE';
  recognition.interimResults = true;
  recognition.continuous = false;
  let handled = false;

  setCallState('listening');
  callCaptionEl.textContent = '';

  recognition.onresult = (event) => {
    let interim = '', final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += transcript;
      else interim += transcript;
    }
    callCaptionEl.textContent = final || interim;
    if (final && !handled) {
      handled = true;
      recognition.stop();
      handleCallUtterance(final.trim());
    }
  };

  recognition.onerror = (event) => {
    if (!callActive) return;
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      handled = true;
      callStatusEl.textContent = 'Mikrofon-Zugriff verweigert';
      endCall();
      alert('Mikrofonzugriff wurde verweigert. Bitte in den Browser-Einstellungen für diese Seite erlauben.');
      return;
    }
    if (event.error === 'no-speech' || event.error === 'aborted') {
      handled = true;
      if (callActive) listenOnce();
      return;
    }
    handled = true;
    callStatusEl.textContent = 'Fehler: ' + event.error;
    if (callActive) setTimeout(() => { if (callActive) listenOnce(); }, 1500);
  };

  recognition.onend = () => {
    if (!handled && callActive) listenOnce();
  };

  try { recognition.start(); } catch (e) {}
}

async function handleCallUtterance(text) {
  if (!text) { if (callActive) listenOnce(); return; }
  callCaptionEl.textContent = text;
  setCallState('idle');
  callStatusEl.textContent = getPersona(activeTab).name + ' denkt nach…';
  try {
    const reply = await askPersona(activeTab, text);
    if (!callActive) return;
    if (!reply) { if (callActive) listenOnce(); return; }
    if (activeTab === 'team') {
      speakSegmentsQueue(
        parseTeamReply(reply), 0,
        () => { if (callActive) listenOnce(); },
        (seg, key) => {
          callCaptionEl.textContent = (seg.name ? getPersona(key).name + ': ' : '') + seg.text;
          setCallState('speaking');
        },
        true
      );
    } else {
      callCaptionEl.textContent = reply;
      setCallState('speaking');
      speak(reply, () => { if (callActive) listenOnce(); }, true, activeTab);
    }
  } catch (err) {
    if (!callActive) return;
    // Bei falschem/fehlendem Zugangscode zeigt askPersona schon den Login-
    // Screen - der Anruf soll dann sauber enden statt endlos weiterzuhören.
    if (err.message === 'Unauthorized') {
      endCall();
      return;
    }
    callCaptionEl.textContent = 'Verbindungsfehler: ' + err.message;
    callStatusEl.textContent = 'Fehler';
    setTimeout(() => { if (callActive) listenOnce(); }, 2000);
  }
}

callBtn.addEventListener('click', startCall);
hangupBtn.addEventListener('click', endCall);

// PWA: Service Worker optional weggelassen (keine Offline-Pflicht für diesen Zweck)
</script>
