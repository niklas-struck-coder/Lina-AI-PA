<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lina & Team</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lina">
<meta name="theme-color" content="#FAF6EF">
<style>
  :root {
    --cream: #FAF6EF;
    --cream-panel: #F0E7D6;
    --white: #FFFFFF;
    --ink: #2B2A28;
    --muted: #948773;
    --teal: #00A98F;
    --gold: #A8600A;
    --danger: #E4573D;
    --persona: #00A98F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    background: var(--cream);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--white);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 1px 3px rgba(43,42,40,0.04);
    flex-shrink: 0;
  }
  .avatar-badge {
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0; overflow: hidden;
    background: color-mix(in srgb, var(--persona) 18%, var(--cream-panel));
  }
  .avatar-badge img { width: 100%; height: 100%; object-fit: cover; }
  header .title { font-weight: 700; font-size: 18px; }
  header .status { font-size: 12px; color: var(--teal); }
  header .status.offline { color: var(--danger); }
  header .actions { display: flex; gap: 8px; flex-shrink: 0; }

  #tabs {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    overflow-x: auto;
    background: var(--white);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    flex-shrink: 0;
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(0,0,0,0.08);
    background: var(--cream-panel);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--tab-color, var(--teal));
    color: #ffffff;
    border-color: transparent;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    max-width: 88%;
    animation: fadeInUp 0.25s ease;
  }
  .msg-row.lina { align-self: flex-start; }
  .msg-row.user { align-self: flex-end; }
  .msg-avatar-badge {
    width: 26px; height: 26px; border-radius: 50%;
    flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    background: color-mix(in srgb, var(--badge-color, var(--teal)) 20%, var(--cream-panel));
  }
  .msg-avatar-badge img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg {
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
  }
  .msg.lina {
    background: var(--white);
    border: 1px solid rgba(0,0,0,0.05);
    border-left: 3px solid var(--badge-color, transparent);
    box-shadow: 0 1px 2px rgba(43,42,40,0.05);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: var(--teal);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }
  .msg.thinking { color: var(--muted); font-style: italic; }
  .msg-label { font-size: 11px; font-weight: 700; margin-bottom: 3px; color: var(--badge-color, var(--muted)); }
  .msg-caption { white-space: pre-wrap; }
  .msg.has-image { padding: 6px; }
  .msg.has-image .msg-caption { padding: 8px 6px 2px; }
  .msg-image {
    display: block;
    max-width: 220px;
    width: 100%;
    border-radius: 12px;
  }

  #imagePreview {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--cream-panel);
    border-top: 1px solid rgba(0,0,0,0.06);
  }
  #imagePreview img {
    width: 48px; height: 48px; border-radius: 10px; object-fit: cover;
  }
  #imagePreview span { font-size: 13px; color: var(--muted); flex: 1; }
  #removeImage {
    background: rgba(0,0,0,0.08);
    border: none;
    border-radius: 50%;
    width: 26px; height: 26px;
    cursor: pointer;
    color: var(--ink);
    font-size: 14px;
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: var(--white);
    border-top: 1px solid rgba(0,0,0,0.06);
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: var(--cream-panel);
    border: 1px solid rgba(0,0,0,0.06);
    color: var(--ink);
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 15px;
    outline: none;
  }
  button#send, button#mute, button#call, button#attach {
    border-radius: 999px;
    width: 46px; height: 46px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    border: none;
  }
  button#send {
    background: var(--teal);
    color: #ffffff;
  }
  button#mute, button#call, button#attach {
    background: transparent;
    border: 1px solid rgba(0,0,0,0.1);
    color: var(--ink);
  }
  button#mute.muted { color: var(--muted); }

  #setup {
    padding: 20px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }
  #setup code {
    background: var(--cream-panel);
    padding: 2px 6px;
    border-radius: 6px;
    color: var(--gold);
  }

  /* ---- Anruf-Overlay ---- */
  #callOverlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, var(--white), var(--cream) 75%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 56px 24px 44px;
    z-index: 50;
    text-align: center;
  }
  #callOverlay.active { display: flex; }
  .call-avatar-wrap { position: relative; margin-top: 32px; }
  .call-avatar {
    width: 140px; height: 140px; border-radius: 50%;
    object-fit: cover; position: relative; z-index: 2;
    border: 3px solid rgba(0,0,0,0.06);
    box-shadow: 0 4px 20px rgba(43,42,40,0.12);
  }
  .call-avatar.emoji {
    display: flex; align-items: center; justify-content: center;
    font-size: 64px;
    background: color-mix(in srgb, var(--persona) 18%, var(--white));
  }
  .call-avatar-ring {
    position: absolute; inset: -14px; border-radius: 50%;
    border: 2px solid var(--teal); opacity: 0;
  }
  #callOverlay.listening .call-avatar-ring {
    animation: pulse-ring 1.6s ease-out infinite; opacity: 1;
  }
  #callOverlay.speaking .call-avatar-ring {
    animation: pulse-ring 0.9s ease-out infinite; opacity: 1; border-color: var(--gold);
  }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .call-name { margin-top: 20px; font-size: 22px; font-weight: 700; }
  .call-status { margin-top: 6px; font-size: 14px; color: var(--muted); min-height: 20px; }
  .call-caption {
    margin-top: 24px; font-size: 16px; text-align: center;
    color: var(--ink); min-height: 48px; max-width: 420px; line-height: 1.4;
  }
  .hangup-btn {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--danger); color: white; border: none; font-size: 26px;
    cursor: pointer; box-shadow: 0 4px 16px rgba(228,87,61,0.35);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="headerAvatar" class="avatar-badge"></div>
    <div>
      <div class="title" id="headerTitle">Lina</div>
      <div class="status" id="status">bereit</div>
    </div>
    <div style="flex:1"></div>
    <div class="actions">
      <button id="call" title="Anrufen">📞</button>
      <button id="mute" title="Stimme an/aus">🔊</button>
    </div>
  </header>

  <nav id="tabs">
    <button class="tab" data-persona="lina">💬 Lina</button>
    <button class="tab" data-persona="it">🖥️ IT-Chef</button>
    <button class="tab" data-persona="marketing">📈 Marketing</button>
    <button class="tab" data-persona="support">🎧 Support</button>
    <button class="tab" data-persona="team">👥 Team-Meeting</button>
  </nav>

  <div id="messages"></div>

  <div id="setup" style="display:none">
    Um mit dem Team zu sprechen, trage unten in <code>WORKER_URL</code> im Quellcode
    die Adresse deines Cloudflare-Worker-Proxys ein (siehe Anleitung).
  </div>

  <div id="imagePreview">
    <img id="imagePreviewImg" alt="Vorschau">
    <span>Bild wird mitgeschickt</span>
    <button type="button" id="removeImage" title="Entfernen">✕</button>
  </div>

  <form id="composer">
    <input type="file" id="imageInput" accept="image/*" hidden>
    <button type="button" id="attach" title="Bild senden">🖼️</button>
    <input id="input" type="text" placeholder="Schreib etwas…" autocomplete="off">
    <button id="send" type="submit">➤</button>
  </form>

  <div id="callOverlay">
    <div class="call-avatar-wrap">
      <div class="call-avatar-ring"></div>
      <div class="call-avatar" id="callAvatar"></div>
    </div>
    <div>
      <div class="call-name" id="callName">Lina</div>
      <div class="call-status" id="callStatus">Verbindet…</div>
      <div class="call-caption" id="callCaption"></div>
    </div>
    <button id="hangup" class="hangup-btn" title="Auflegen">📵</button>
  </div>
</div>

<script>
// ---- Konfiguration ----
// Trag hier die URL deines Cloudflare-Worker-Proxys ein, z.B.:
// const WORKER_URL = "https://lina-proxy.dein-name.workers.dev";
const WORKER_URL = "PASTE_YOUR_WORKER_URL_HERE";
const MAX_IMAGE_BYTES = 4 * 1024 * 1024;

// ---- Team ----
const PERSONAS = {
  lina: {
    name: 'Lina', tabLabel: '💬 Lina', role: 'Persönliche Assistentin',
    avatarType: 'img', avatar: 'icon-192.png', color: '#00A98F',
    greeting: 'Hey, ich bin Lina 👋 Frag mich einfach etwas, schick mir ein Bild, oder ruf mich an.',
  },
  it: {
    name: 'IT-Chef', tabLabel: '🖥️ IT-Chef', role: 'Technik & Entwicklung',
    avatarType: 'emoji', avatar: '🖥️', color: '#3E6FB0',
    greeting: 'IT-Chef hier 🖥️ Frag mich zu Code, Architektur oder travix.ai-Technik.',
  },
  marketing: {
    name: 'Marketing-Chef', tabLabel: '📈 Marketing', role: 'Marketing & Strategie',
    avatarType: 'emoji', avatar: '📈', color: '#D98A2B',
    greeting: 'Marketing-Chef hier 📈 Lass uns über Positionierung, Zielgruppen oder Kampagnen sprechen.',
  },
  support: {
    name: 'Support-Chef', tabLabel: '🎧 Support', role: 'Kundenservice & Support',
    avatarType: 'emoji', avatar: '🎧', color: '#8E5FC7',
    greeting: 'Support-Chef hier 🎧 Frag mich zu Kundenerfahrung, Support-Prozessen oder Nutzerproblemen.',
  },
  team: {
    name: 'Team-Meeting', tabLabel: '👥 Team-Meeting', role: 'Alle zusammen',
    avatarType: 'emoji', avatar: '👥', color: '#4A4640',
    greeting: 'Willkommen im Team-Meeting 👥 Frag etwas — die passenden Personen antworten.',
  },
};
const PERSONA_ORDER = ['lina', 'it', 'marketing', 'support', 'team'];
const NAME_TO_KEY = Object.fromEntries(
  PERSONA_ORDER.filter(k => k !== 'team').map(k => [PERSONAS[k].name, k])
);

let activeTab = localStorage.getItem('lina_active_tab') || 'lina';
if (!PERSONAS[activeTab]) activeTab = 'lina';

const messagesEl = document.getElementById('messages');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const muteBtn = document.getElementById('mute');
const setupEl = document.getElementById('setup');
const attachBtn = document.getElementById('attach');
const imageInput = document.getElementById('imageInput');
const imagePreview = document.getElementById('imagePreview');
const imagePreviewImg = document.getElementById('imagePreviewImg');
const removeImageBtn = document.getElementById('removeImage');
const headerAvatarEl = document.getElementById('headerAvatar');
const headerTitleEl = document.getElementById('headerTitle');

let histories = loadHistories();
let muted = localStorage.getItem('lina_muted') === 'true';
let pendingImage = null; // { mediaType, base64, dataUrl }

if (WORKER_URL.includes('PASTE_YOUR_WORKER_URL_HERE')) {
  setupEl.style.display = 'block';
  statusEl.textContent = 'nicht eingerichtet';
  statusEl.classList.add('offline');
}

function loadHistories() {
  const raw = localStorage.getItem('lina_team_history');
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      PERSONA_ORDER.forEach(k => { if (!Array.isArray(parsed[k])) parsed[k] = []; });
      return parsed;
    } catch (e) { /* fällt durch auf leeren Zustand */ }
  }
  const base = { lina: [], it: [], marketing: [], support: [], team: [] };
  // Migration von der alten Einzel-Lina-Version
  const legacy = localStorage.getItem('lina_history');
  if (legacy) {
    try { base.lina = JSON.parse(legacy); } catch (e) {}
  }
  return base;
}

function saveHistories() {
  try {
    localStorage.setItem('lina_team_history', JSON.stringify(histories));
  } catch (e) {
    let trimmed = false;
    PERSONA_ORDER.forEach(k => {
      while (histories[k].length > 4) { histories[k].shift(); trimmed = true; }
    });
    if (trimmed) {
      try { localStorage.setItem('lina_team_history', JSON.stringify(histories)); } catch (e2) {}
    }
  }
}

function setAvatarBadge(el, persona) {
  el.innerHTML = '';
  el.style.setProperty('--badge-color', persona.color);
  if (persona.avatarType === 'img') {
    const img = document.createElement('img');
    img.src = persona.avatar;
    img.alt = persona.name;
    el.appendChild(img);
  } else {
    el.textContent = persona.avatar;
  }
}

function applyPersonaChrome() {
  const p = PERSONAS[activeTab];
  document.documentElement.style.setProperty('--persona', p.color);
  headerTitleEl.textContent = p.name;
  setAvatarBadge(headerAvatarEl, p);
  document.querySelectorAll('.tab').forEach(btn => {
    const isActive = btn.dataset.persona === activeTab;
    btn.classList.toggle('active', isActive);
    btn.style.setProperty('--tab-color', PERSONAS[btn.dataset.persona].color);
  });
  input.placeholder = activeTab === 'team' ? 'Frag das ganze Team…' : `Schreib ${p.name} etwas…`;
}

function contentToDisplay(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    const textBlock = content.find(b => b.type === 'text');
    const imageBlock = content.find(b => b.type === 'image');
    return {
      text: textBlock ? textBlock.text : '',
      imageDataUrl: imageBlock ? ('data:' + imageBlock.source.media_type + ';base64,' + imageBlock.source.data) : null,
    };
  }
  return '';
}

// Zerlegt eine Team-Antwort ("Lina: ...\nIT-Chef: ...") in einzelne Wortmeldungen
function parseTeamReply(text) {
  const lines = String(text || '').split('\n');
  const names = Object.keys(NAME_TO_KEY);
  const segments = [];
  let current = null;
  lines.forEach(line => {
    const match = names.find(name => line.startsWith(name + ':'));
    if (match) {
      if (current) segments.push(current);
      current = { name: match, text: line.slice(match.length + 1).trim() };
    } else if (current) {
      current.text += (line ? (current.text ? '\n' : '') + line : '');
    } else if (line.trim()) {
      current = { name: null, text: line.trim() };
    }
  });
  if (current) segments.push(current);
  return segments.filter(s => s.text && s.text.trim());
}

function renderTeamReply(text, scroll = true) {
  const segments = parseTeamReply(text);
  if (segments.length === 0) {
    addBubble('lina', text, scroll, 'team', PERSONAS.team.name);
    return;
  }
  segments.forEach(seg => {
    const key = seg.name ? (NAME_TO_KEY[seg.name] || 'team') : 'team';
    addBubble('lina', seg.text, scroll, key, seg.name || PERSONAS.team.name);
  });
}

function renderActiveTab() {
  messagesEl.innerHTML = '';
  const hist = histories[activeTab];
  if (hist.length === 0) {
    addBubble('lina', PERSONAS[activeTab].greeting, false, activeTab);
  } else {
    hist.forEach(m => {
      if (m.role === 'assistant') {
        if (activeTab === 'team' && typeof m.content === 'string') {
          renderTeamReply(m.content, false);
        } else {
          addBubble('lina', contentToDisplay(m.content), false, activeTab);
        }
      } else {
        addBubble('user', contentToDisplay(m.content), false);
      }
    });
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addBubble(who, content, scroll = true, personaKey = 'lina', label = null) {
  const classes = who.split(' ');
  const row = document.createElement('div');
  row.className = 'msg-row ' + who;

  if (classes[0] === 'lina') {
    const p = PERSONAS[personaKey] || PERSONAS.lina;
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar-badge';
    setAvatarBadge(avatar, p);
    row.appendChild(avatar);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg ' + who;
  if (classes[0] === 'lina') {
    bubble.style.setProperty('--badge-color', (PERSONAS[personaKey] || PERSONAS.lina).color);
  }

  if (label) {
    const labelEl = document.createElement('div');
    labelEl.className = 'msg-label';
    labelEl.textContent = label;
    bubble.appendChild(labelEl);
  }

  const text = typeof content === 'string' ? content : (content.text || '');
  const imageDataUrl = typeof content === 'string' ? null : content.imageDataUrl;

  if (imageDataUrl) {
    bubble.classList.add('has-image');
    const img = document.createElement('img');
    img.src = imageDataUrl;
    img.className = 'msg-image';
    img.alt = 'Bild';
    bubble.appendChild(img);
  }
  if (text || !imageDataUrl) {
    const caption = document.createElement('div');
    caption.className = 'msg-caption';
    caption.textContent = text;
    bubble.appendChild(caption);
  }

  row.appendChild(bubble);
  messagesEl.appendChild(row);
  if (scroll) messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

// speak(text, onEnd, force) - force=true spricht auch wenn stummgeschaltet (Anruf-Modus)
function speak(text, onEnd, force = false) {
  if (muted && !force) { if (onEnd) onEnd(); return; }
  if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'de-DE';
  utter.pitch = 1.1;
  utter.rate = 1.02;
  const voices = window.speechSynthesis.getVoices();
  const femaleNames = ['petra', 'anna', 'helena', 'female', 'samantha', 'google deutsch', 'martina', 'katja'];
  let voice = voices.find(v => v.lang.toLowerCase().startsWith('de') &&
    femaleNames.some(n => v.name.toLowerCase().includes(n)));
  if (!voice) voice = voices.find(v => v.lang.toLowerCase().startsWith('de'));
  if (voice) utter.voice = voice;
  if (onEnd) utter.onend = onEnd;
  window.speechSynthesis.speak(utter);
}

function speakTeamReply(text) {
  const segments = parseTeamReply(text);
  if (segments.length === 0) { speak(text); return; }
  const combined = segments.map(seg => seg.name ? `${seg.name} sagt: ${seg.text}` : seg.text).join('. ');
  speak(combined);
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

function updateMuteBtn() {
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.classList.toggle('muted', muted);
}

muteBtn.addEventListener('click', () => {
  muted = !muted;
  localStorage.setItem('lina_muted', muted);
  updateMuteBtn();
  if (muted) window.speechSynthesis.cancel();
});

// ---- Tabs ----
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    if (callActive) endCall();
    activeTab = btn.dataset.persona;
    localStorage.setItem('lina_active_tab', activeTab);
    applyPersonaChrome();
    renderActiveTab();
  });
});

// ---- Bild-Anhang ----
attachBtn.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  imageInput.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    alert('Bitte eine Bilddatei auswählen.');
    return;
  }
  if (file.size > MAX_IMAGE_BYTES) {
    alert('Das Bild ist zu groß (max. 4 MB).');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    const base64 = dataUrl.split(',')[1];
    pendingImage = { mediaType: file.type, base64, dataUrl };
    imagePreviewImg.src = dataUrl;
    imagePreview.style.display = 'flex';
  };
  reader.readAsDataURL(file);
});

removeImageBtn.addEventListener('click', () => {
  pendingImage = null;
  imagePreview.style.display = 'none';
});

// ---- Nachricht an eine Persona schicken ----
// userContent: was an die API geschickt wird (String oder Content-Block-Array)
// displayContent: was als Chat-Bubble gerendert wird (String oder {text, imageDataUrl})
async function askPersona(personaKey, userContent, displayContent) {
  const hist = histories[personaKey];
  addBubble('user', displayContent !== undefined ? displayContent : userContent);
  hist.push({ role: 'user', content: userContent });
  saveHistories();

  const thinkingBubble = addBubble('lina thinking', PERSONAS[personaKey].name + ' denkt nach …', true, personaKey);
  statusEl.textContent = 'tippt…';

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: hist, persona: personaKey })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    thinkingBubble.remove();
    const reply = data.reply || '(keine Antwort erhalten)';

    if (personaKey === 'team') {
      renderTeamReply(reply);
    } else {
      addBubble('lina', reply, true, personaKey);
    }

    hist.push({ role: 'assistant', content: reply });
    saveHistories();
    statusEl.textContent = 'bereit';
    statusEl.classList.remove('offline');
    return reply;
  } catch (err) {
    thinkingBubble.remove();
    addBubble('lina', 'Hmm, ich konnte gerade nicht antworten. (' + err.message + ')', true, personaKey);
    statusEl.textContent = 'Verbindungsfehler';
    statusEl.classList.add('offline');
    throw err;
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text && !pendingImage) return;
  input.value = '';

  let userContent, displayContent;
  if (pendingImage) {
    userContent = [
      { type: 'image', source: { type: 'base64', media_type: pendingImage.mediaType, data: pendingImage.base64 } },
    ];
    if (text) userContent.push({ type: 'text', text });
    displayContent = { text, imageDataUrl: pendingImage.dataUrl };
    pendingImage = null;
    imagePreview.style.display = 'none';
  } else {
    userContent = text;
    displayContent = text;
  }

  try {
    const reply = await askPersona(activeTab, userContent, displayContent);
    if (activeTab === 'team') {
      speakTeamReply(reply);
    } else {
      speak(reply);
    }
  } catch (err) {
    // Fehler wurde bereits als Bubble angezeigt
  }
});

applyPersonaChrome();
renderActiveTab();
updateMuteBtn();

// ---- Anruf-Modus (Mikrofon + gesprochene Antworten) ----
const callBtn = document.getElementById('call');
const callOverlay = document.getElementById('callOverlay');
const callAvatarEl = document.getElementById('callAvatar');
const callNameEl = document.getElementById('callName');
const callStatusEl = document.getElementById('callStatus');
const callCaptionEl = document.getElementById('callCaption');
const hangupBtn = document.getElementById('hangup');

const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let callActive = false;

function setCallState(state) {
  callOverlay.classList.remove('listening', 'speaking', 'idle');
  callOverlay.classList.add(state);
  const labels = { listening: 'Hört zu…', speaking: 'spricht…', idle: 'Verbunden' };
  callStatusEl.textContent = labels[state] || '';
}

function setupCallChrome() {
  const p = PERSONAS[activeTab];
  callNameEl.textContent = p.name;
  callAvatarEl.innerHTML = '';
  callAvatarEl.classList.remove('emoji');
  if (p.avatarType === 'img') {
    const img = document.createElement('img');
    img.src = p.avatar;
    img.alt = p.name;
    img.style.width = '100%'; img.style.height = '100%';
    img.style.objectFit = 'cover'; img.style.borderRadius = '50%';
    callAvatarEl.appendChild(img);
  } else {
    callAvatarEl.classList.add('emoji');
    callAvatarEl.textContent = p.avatar;
  }
}

function startCall() {
  if (!SpeechRecognitionCtor) {
    alert('Sprachanrufe werden von diesem Browser nicht unterstützt. Bitte Chrome oder Edge verwenden (auf dem iPhone: Safari unterstützt das leider nicht zuverlässig).');
    return;
  }
  if (WORKER_URL.includes('PASTE_YOUR_WORKER_URL_HERE')) {
    alert('Bitte zuerst WORKER_URL im Quellcode einrichten (siehe README).');
    return;
  }
  callActive = true;
  setupCallChrome();
  callOverlay.classList.add('active');
  callCaptionEl.textContent = '';
  window.speechSynthesis.cancel();
  listenOnce();
}

function endCall() {
  callActive = false;
  callOverlay.classList.remove('active', 'listening', 'speaking', 'idle');
  if (recognition) { try { recognition.stop(); } catch (e) {} }
  window.speechSynthesis.cancel();
}

function listenOnce() {
  if (!callActive) return;
  recognition = new SpeechRecognitionCtor();
  recognition.lang = 'de-DE';
  recognition.interimResults = true;
  recognition.continuous = false;
  let handled = false;

  setCallState('listening');
  callCaptionEl.textContent = '';

  recognition.onresult = (event) => {
    let interim = '', final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += transcript;
      else interim += transcript;
    }
    callCaptionEl.textContent = final || interim;
    if (final && !handled) {
      handled = true;
      recognition.stop();
      handleCallUtterance(final.trim());
    }
  };

  recognition.onerror = (event) => {
    if (!callActive) return;
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      handled = true;
      callStatusEl.textContent = 'Mikrofon-Zugriff verweigert';
      endCall();
      alert('Mikrofonzugriff wurde verweigert. Bitte in den Browser-Einstellungen für diese Seite erlauben.');
      return;
    }
    if (event.error === 'no-speech' || event.error === 'aborted') {
      handled = true;
      if (callActive) listenOnce();
      return;
    }
    handled = true;
    callStatusEl.textContent = 'Fehler: ' + event.error;
    if (callActive) setTimeout(() => { if (callActive) listenOnce(); }, 1500);
  };

  recognition.onend = () => {
    if (!handled && callActive) listenOnce();
  };

  try { recognition.start(); } catch (e) {}
}

function speakSegmentsSequentially(segments, idx) {
  if (idx >= segments.length) { if (callActive) listenOnce(); return; }
  const seg = segments[idx];
  callCaptionEl.textContent = (seg.name ? seg.name + ': ' : '') + seg.text;
  setCallState('speaking');
  const spoken = seg.name ? `${seg.name} sagt: ${seg.text}` : seg.text;
  speak(spoken, () => speakSegmentsSequentially(segments, idx + 1), true);
}

async function handleCallUtterance(text) {
  if (!text) { if (callActive) listenOnce(); return; }
  callCaptionEl.textContent = text;
  setCallState('idle');
  callStatusEl.textContent = PERSONAS[activeTab].name + ' denkt nach…';
  try {
    const reply = await askPersona(activeTab, text);
    if (!callActive) return;
    if (activeTab === 'team') {
      speakSegmentsSequentially(parseTeamReply(reply), 0);
    } else {
      callCaptionEl.textContent = reply;
      setCallState('speaking');
      speak(reply, () => { if (callActive) listenOnce(); }, true);
    }
  } catch (err) {
    if (callActive) listenOnce();
  }
}

callBtn.addEventListener('click', startCall);
hangupBtn.addEventListener('click', endCall);

// PWA: Service Worker optional weggelassen (keine Offline-Pflicht für diesen Zweck)
